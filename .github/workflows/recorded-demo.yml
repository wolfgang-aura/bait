name: Recorded demo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  verify-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: validation/package-lock.json
      - run: npm --prefix validation ci
      - run: npm test
      - run: npm run results:export
      - run: npm run demo:package
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: scratch/bait-recorded-demo
      - name: Deploy recorded demo
        id: deployment
        uses: actions/deploy-pages@v4
