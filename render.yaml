# Render Blueprint for the hosted BAIT demo. One free web service, frozen evidence,
# hard spend caps. PORT is injected by Render; the server reads it.
#
# The model key is declared with sync: false, so Render prompts for it in the dashboard
# on first deploy and never stores it in this file or in Git. Hosted mode serves frozen
# Nansen evidence and therefore does not receive a Nansen key.
services:
  - type: web
    name: bait
    runtime: node
    plan: free
    # Runtime dependencies live in validation/package.json (the root has no lockfile).
    buildCommand: npm ci --omit=dev --prefix validation
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTED
        value: "1"
      - key: NANSEN_LIVE
        value: "0"
      - key: HOSTED_ROUNDS_PER_IP
        value: "12"
      - key: HOSTED_DAILY_CALLS
        value: "300"
      - key: DEEPSEEK_API_KEY
        sync: false
