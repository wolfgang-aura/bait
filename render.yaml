# Render Blueprint for the hosted BAIT demo. One free web service, frozen evidence,
# hard spend caps. PORT is injected by Render; the server reads it.
#
# Both keys are declared with sync: false, so they never live in this file or in Git.
# Set NANSEN_API_KEY with `node scripts/sync-render-env.mjs --apply` from a machine
# whose .env holds it. Without it the room plays the frozen capture and says so: the
# live read needs NANSEN_LIVE=1 and a key, and spends at most
# HOSTED_NANSEN_CREDITS_PER_DAY credits a day and HOSTED_NANSEN_CREDITS_TOTAL overall
# (in memory on the free plan, so the total resets when the service restarts).
services:
  - type: web
    name: bait
    runtime: node
    plan: free
    # Runtime dependencies live in validation/package.json (the root has no lockfile).
    buildCommand: npm ci --omit=dev --prefix validation
    startCommand: npm start
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: HOSTED
        value: "1"
      - key: NANSEN_LIVE
        value: "1"
      - key: HOSTED_NANSEN_CREDITS_PER_DAY
        value: "2000"
      - key: HOSTED_NANSEN_CREDITS_TOTAL
        value: "18000"
      # 0 = no per-address round cap (23 Sep 2026); the global DeepSeek cap is the cost guard.
      - key: HOSTED_ROUNDS_PER_IP
        value: "0"
      - key: HOSTED_DAILY_CALLS
        value: "3000"
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: NANSEN_API_KEY
        sync: false
